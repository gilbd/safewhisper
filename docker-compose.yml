services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: safewhisper-engine:local
    container_name: safewhisper-engine
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - ${HOME}/.safewhisper/run:/run/safewhisper
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 6g
    restart: "no"

volumes: {}
