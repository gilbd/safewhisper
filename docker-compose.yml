services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: safewhisper-engine:local
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - safewhisper-socket:/run/safewhisper
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 6g
    restart: unless-stopped

volumes:
  safewhisper-socket:
