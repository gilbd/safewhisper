name: Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - 'src/safewhisper/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Windows client dependencies
        run: python -m pip install -r windows/requirements.txt
      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile windows/safewhisper_windows.py
          Get-ChildItem src/safewhisper -Filter *.py | ForEach-Object { python -m py_compile $_.FullName }
      - name: Build SafeWhisper.exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SafeWhisper windows/safewhisper_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: SafeWhisper-Windows
          path: dist/SafeWhisper.exe
